<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">ProtocolAI semantic boundary</title>
<desc id="desc">A visual showing probabilistic language entering ProtocolAI, becoming deterministic application-owned identity, and then flowing to host policy and application state.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#17142d"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#6ee7f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8b3cf"/></marker>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<circle cx="108" cy="94" r="62" fill="#6ee7f9" opacity=".08"/>
<circle cx="1080" cy="520" r="90" fill="#a78bfa" opacity=".08"/>
<text x="70" y="72" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">ProtocolAI</text>
<text x="70" y="104" fill="#a8b3cf" font-family="Segoe UI,Arial,sans-serif" font-size="16">From probabilistic language to application-owned identity</text>

<g font-family="Segoe UI,Arial,sans-serif">
  <rect x="65" y="205" width="210" height="170" rx="22" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="245" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">MODEL</text>
  <text x="170" y="275" text-anchor="middle" fill="#a8b3cf" font-size="14">probabilistic proposal</text>
  <text x="170" y="318" text-anchor="middle" fill="#e2e8f0" font-size="16">“Bob”</text>
  <text x="170" y="348" text-anchor="middle" fill="#94a3b8" font-size="13">candidate value</text>

  <line x1="285" y1="290" x2="380" y2="290" stroke="#a8b3cf" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="385" y="155" width="310" height="270" rx="26" fill="#111827" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
  <text x="540" y="202" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">PROTOCOLAI</text>
  <text x="540" y="230" text-anchor="middle" fill="#a8b3cf" font-size="14">deterministic semantic boundary</text>
  <rect x="430" y="260" width="220" height="52" rx="12" fill="#1e293b"/>
  <text x="540" y="292" text-anchor="middle" fill="#6ee7f9" font-size="19" font-weight="700">[1001 : 2001]</text>
  <text x="540" y="343" text-anchor="middle" fill="#e2e8f0" font-size="15">known → identity</text>
  <text x="540" y="372" text-anchor="middle" fill="#e2e8f0" font-size="15">unknown → literal</text>
  <text x="540" y="401" text-anchor="middle" fill="#94a3b8" font-size="13">validate • resolve • describe</text>

  <line x1="705" y1="290" x2="800" y2="290" stroke="#a8b3cf" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="805" y="205" width="155" height="170" rx="22" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="882" y="245" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">HOST</text>
  <text x="882" y="275" text-anchor="middle" fill="#a8b3cf" font-size="14">policy</text>
  <text x="882" y="318" text-anchor="middle" fill="#e2e8f0" font-size="14">allow</text>
  <text x="882" y="344" text-anchor="middle" fill="#e2e8f0" font-size="14">reject</text>

  <line x1="970" y1="290" x2="1055" y2="290" stroke="#a8b3cf" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1060" y="205" width="95" height="170" rx="22" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="1107" y="248" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">APP</text>
  <text x="1107" y="281" text-anchor="middle" fill="#a8b3cf" font-size="12">state</text>
  <text x="1107" y="318" text-anchor="middle" fill="#e2e8f0" font-size="12">action</text>
  <text x="1107" y="344" text-anchor="middle" fill="#e2e8f0" font-size="12">experience</text>

  <text x="600" y="515" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">The model proposes. ProtocolAI identifies. The host decides.</text>
  <text x="600" y="548" text-anchor="middle" fill="#94a3b8" font-size="14">The provider is optional. The application owns the meaning.</text>
</g>
</svg>