<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">ProtocolPayload JSON round trip</title>
  <desc id="desc">An animated payload travels from an application-owned ProtocolDefinition through ProtocolPayload, JSON transport, deserialization, validation, and resolution. The receiving definition remains the authority for meaning.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .heading{font-size:25px;font-weight:700}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#44516a}
      .node{fill:#fff;stroke:#53647f;stroke-width:2}.authority{fill:#e8f4ff;stroke:#2476ad}.transport{fill:#f4edff;stroke:#7c52b8}.gate{fill:#fff2d9;stroke:#b7791f}
      .wire{fill:none;stroke:#65758b;stroke-width:3;stroke-linecap:round}.signal{fill:#e25835;stroke:#fff;stroke-width:2}
      @media(prefers-reduced-motion:reduce){.moving{display:none}}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#65758b"/></marker>
  </defs>
  <rect width="1000" height="390" rx="18" fill="#f8fafc"/>
  <text x="34" y="42" class="heading">The payload travels. Meaning stays owned.</text>
  <text x="34" y="66" class="small">Illustrative flow · validate against the expected definition after deserialization</text>
  <path class="wire" marker-end="url(#arrow)" d="M165 163 H205 M345 163 H385 M525 163 H565 M705 163 H745"/>
  <rect class="node authority" x="25" y="112" width="140" height="102" rx="12"/>
  <text x="95" y="145" text-anchor="middle" class="label">Definition</text><text x="95" y="168" text-anchor="middle" class="small">owns meaning</text><text x="95" y="189" text-anchor="middle" class="small">IDs + vocabulary</text>
  <rect class="node" x="205" y="112" width="140" height="102" rx="12"/>
  <text x="275" y="145" text-anchor="middle" class="label">Payload</text><text x="275" y="168" text-anchor="middle" class="small">refs + literals</text><text x="275" y="189" text-anchor="middle" class="small">ordered values</text>
  <rect class="node transport" x="385" y="112" width="140" height="102" rx="12"/>
  <text x="455" y="145" text-anchor="middle" class="label">JSON</text><text x="455" y="168" text-anchor="middle" class="small">wire shape</text><text x="455" y="189" text-anchor="middle" class="small">transport only</text>
  <rect class="node" x="565" y="112" width="140" height="102" rx="12"/>
  <text x="635" y="145" text-anchor="middle" class="label">Deserialize</text><text x="635" y="168" text-anchor="middle" class="small">shape checks</text><text x="635" y="189" text-anchor="middle" class="small">untrusted input</text>
  <rect class="node gate" x="745" y="112" width="220" height="102" rx="12"/>
  <text x="855" y="145" text-anchor="middle" class="label">Validate + resolve</text><text x="855" y="168" text-anchor="middle" class="small">expected definition</text><text x="855" y="189" text-anchor="middle" class="small">then host policy</text>
  <path class="wire" d="M95 214 V273 H855 V214" stroke-dasharray="6 6"/>
  <text x="475" y="301" text-anchor="middle" class="label">The receiving definition is the semantic authority</text>
  <text x="475" y="325" text-anchor="middle" class="small">JSON can carry an identity; it cannot make that identity valid or authorized.</text>
  <circle class="signal moving" r="8"><animateMotion dur="7s" repeatCount="indefinite" path="M95 214 V273 H855 V214"/></circle>
  <text x="34" y="365" class="small">Source contract: ProtocolPayloadJson → Deserialize → ProtocolDefinition.Validate → Resolve</text>
</svg>