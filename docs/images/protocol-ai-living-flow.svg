<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">ProtocolAi living flow</title>
<desc id="desc">Language candidates move through an application-owned vocabulary. Known values become stable references; unknown values remain literals; validation and resolution lead to a host decision.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172554"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#67e8f9"/></marker>
  <style>
    @keyframes travel { to { stroke-dashoffset:-48; } }
    @keyframes drift { 0% { transform:translateX(0);opacity:.15 } 12% {opacity:1} 88% {opacity:1} 100% { transform:translateX(170px);opacity:.15 } }
    @keyframes breathe { 0%,100% { stroke-width:2;stroke-opacity:.65 } 50% { stroke-width:5;stroke-opacity:1 } }
    @keyframes pop { 0%,100% { opacity:.5 } 50% { opacity:1 } }
    .stream { stroke-dasharray:10 14; animation:travel 1.25s linear infinite; }
    .known { animation:breathe 2.2s ease-in-out infinite; }
    .unknown { animation:pop 1.8s ease-in-out infinite; }
    .particle { animation:drift 3s linear infinite; }
    .p2 { animation-delay:1s }.p3 { animation-delay:2s }
    @media (prefers-reduced-motion:reduce) { .stream,.known,.unknown,.particle { animation:none !important; } }
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="48" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="2">FROM LANGUAGE TO APPLICATION-OWNED IDENTITY</text>
<text x="48" y="83" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Watch the boundary work: language varies; the host retains authority.</text>
<!-- Language -->
<rect x="40" y="140" width="220" height="280" rx="18" fill="#0f1d32" stroke="#64748b" stroke-width="2"/>
<text x="150" y="176" fill="#cbd5e1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">MODEL OUTPUT</text>
<text x="150" y="226" fill="#f8fafc" text-anchor="middle" font-family="monospace" font-size="25">“Bob”</text>
<text x="150" y="276" fill="#f8fafc" text-anchor="middle" font-family="monospace" font-size="25">“Robert”</text>
<text x="150" y="326" fill="#f8fafc" text-anchor="middle" font-family="monospace" font-size="25">“Amelia”</text>
<text x="150" y="378" fill="#94a3b8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">different strings</text>
<!-- Boundary -->
<path d="M260 275 H385" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<path class="stream" d="M260 275 H385" fill="none" stroke="#e0fbff" stroke-width="4"/>
<circle class="particle" cx="270" cy="275" r="7" fill="#e0fbff" filter="url(#glow)"/>
<circle class="particle p2" cx="270" cy="275" r="5" fill="#22d3ee" filter="url(#glow)"/>
<circle class="particle p3" cx="270" cy="275" r="4" fill="#c4b5fd" filter="url(#glow)"/>
<rect x="385" y="140" width="250" height="280" rx="18" fill="#0b2032" stroke="url(#cyan)" stroke-width="3"/>
<text x="510" y="176" fill="#67e8f9" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">PROTOCOLAI</text>
<text x="510" y="214" fill="#f8fafc" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">Encode</text>
<rect class="known" x="414" y="238" width="192" height="58" rx="10" fill="#102c42" stroke="#22d3ee" stroke-width="3"/>
<text x="510" y="261" fill="#67e8f9" text-anchor="middle" font-family="monospace" font-size="15">KNOWN</text>
<text x="510" y="282" fill="#f8fafc" text-anchor="middle" font-family="monospace" font-size="18">Bob → [2001]</text>
<rect class="unknown" x="414" y="310" width="192" height="58" rx="10" fill="#302713" stroke="#fbbf24" stroke-width="2"/>
<text x="510" y="333" fill="#fbbf24" text-anchor="middle" font-family="monospace" font-size="15">UNKNOWN</text>
<text x="510" y="354" fill="#f8fafc" text-anchor="middle" font-family="monospace" font-size="18">Amelia → literal</text>
<text x="510" y="395" fill="#94a3b8" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">unknown ≠ invalid</text>
<!-- Validating -->
<path d="M635 275 H735" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<path class="stream" d="M635 275 H735" fill="none" stroke="#e0fbff" stroke-width="4"/>
<circle class="particle" cx="645" cy="275" r="6" fill="#e0fbff" filter="url(#glow)"/>
<rect x="735" y="180" width="180" height="190" rx="18" fill="#111b34" stroke="#a78bfa" stroke-width="3"/>
<text x="825" y="220" fill="#c4b5fd" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">CHECK</text>
<text x="825" y="264" fill="#f8fafc" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">Validate</text>
<text x="825" y="305" fill="#cbd5e1" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Resolve</text>
<text x="825" y="340" fill="#94a3b8" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">protocol + symbol</text>
<!-- Host -->
<path d="M915 275 H980" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<path class="stream" d="M915 275 H980" fill="none" stroke="#e0fbff" stroke-width="4"/>
<circle class="particle p2" cx="925" cy="275" r="6" fill="#e0fbff" filter="url(#glow)"/>
<rect x="980" y="140" width="180" height="280" rx="18" fill="#101a2c" stroke="#f8fafc" stroke-width="2"/>
<text x="1070" y="180" fill="#f8fafc" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">HOST</text>
<text x="1070" y="220" fill="#f8fafc" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">Decides</text>
<path d="M1010 250 H1130" stroke="#334155" stroke-width="2"/>
<text x="1070" y="286" fill="#67e8f9" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">accept</text>
<text x="1070" y="322" fill="#fbbf24" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">clarify</text>
<text x="1070" y="358" fill="#fca5a5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">reject</text>
<text x="600" y="488" fill="#f8fafc" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">The model proposes. ProtocolAi identifies. The host decides.</text>
<text x="600" y="523" fill="#94a3b8" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">Illustrative flow · actual encoding, validation and resolution are library operations</text>
</svg>